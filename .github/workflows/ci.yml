name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, locales, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Locale drift is expected between Crowdin syncs, so this step reports but does
      # not block. Flip continue-on-error off once the flagged locales are caught up.
      - name: Check locales
        run: npm run check-locales
        continue-on-error: true

      - name: Unit tests
        run: npm test

  build:
    name: Build store zip
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build keyless zip
        run: npx grunt zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: tms-zip
          path: build/zip/*.zip
          if-no-files-found: error
          retention-days: 14

      # Provenance needs an OIDC token, which pull requests from forks do not get.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/zip/*.zip
